# Local development stack. Credentials below are local-only throwaway values.
name: northstar-copilot

x-app-service: &app-service
  build:
    context: .
    target: dev
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://northstar:northstar@db:5432/northstar
    OLLAMA_BASE_URL: http://ollama:11434
    SQS_ENDPOINT_URL: http://sqs:9324
    WATCHFILES_FORCE_POLLING: "true" # file events do not cross the Windows -> Linux VM boundary
  volumes:
    - ./:/app
  depends_on:
    db:
      condition: service_healthy
    sqs:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
      POSTGRES_DB: northstar
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqs:
    # SQS-compatible API: same boto3 code path locally and on AWS (only endpoint_url differs).
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324" # SQS API
      - "9325:9325" # stats UI
    volumes:
      - ./infra/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro

  ollama:
    # Local LLM + embedding runtime on the host's NVIDIA GPU. Opt-in profile so machines
    # without a GPU can still run the stack with fake providers: `docker compose --profile llm up`.
    image: ollama/ollama:0.40.14
    profiles: ["llm"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m" # keep models in VRAM between requests (avoids reload latency)
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    <<: *app-service
    ports:
      - "8000:8000"

  worker:
    # Ingestion worker: same image and settings as the API, different entry point.
    <<: *app-service
    command: ["python", "-m", "app.ingestion.worker"]
    stop_grace_period: 20s # time to finish the current message after SIGTERM

volumes:
  pgdata:
  ollama-models:
