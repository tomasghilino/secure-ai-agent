# Continuous integration. Free and offline: fake model providers, local service
# containers, no cloud credentials. Third-party actions are pinned by commit SHA and the
# scanners run from images pinned by digest, so a moved tag cannot change what runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  LLM_PROVIDER: fake
  EMBEDDING_PROVIDER: fake
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/unit

  integration:
    name: Integration tests and AI red team
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: pgvector/pgvector:0.8.7-pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: northstar
          POSTGRES_PASSWORD: northstar # throwaway CI database
          POSTGRES_DB: northstar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northstar -d northstar"
          --health-interval 5s --health-timeout 3s --health-retries 20
      sqs:
        image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
        ports: ["9324:9324"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --all-groups
      # Migrations, Row-Level Security, approvals, limits and the red-team suite
      # (tests/integration/test_red_team.py) against a real PostgreSQL.
      - run: uv run pytest -m integration

  supply-chain:
    name: Secrets, dependencies, configuration and image scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still leaked
          persist-credentials: false
      - name: Secrets in the git history (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Known vulnerabilities in the locked dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --no-emit-project --quiet --output-file requirements.txt
          uvx pip-audit@2.10.1 --requirement requirements.txt --require-hashes --disable-pip --strict
      - name: Misconfigurations and secrets in the repository (Trivy)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -v trivy-cache:/root/.cache/ "$TRIVY_IMAGE"
          fs --quiet --scanners misconfig,secret --severity HIGH,CRITICAL --exit-code 1 /src
      - name: Build the production image
        run: docker build --target runtime -t secure-ai-agent:ci .
      - name: Fixable HIGH and CRITICAL vulnerabilities in the image (Trivy)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/ "$TRIVY_IMAGE"
          image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          secure-ai-agent:ci
      - name: Software bill of materials (CycloneDX)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v trivy-cache:/root/.cache/ -v "$PWD:/out" "$TRIVY_IMAGE"
          image --quiet --format cyclonedx --output /out/sbom.cdx.json secure-ai-agent:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
