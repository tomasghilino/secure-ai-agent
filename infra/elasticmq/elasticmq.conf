include classpath("application.conf")

# "*" = build queue URLs from the request Host header, so the same queue works from the
# host (localhost:9324) and from containers (sqs:9324).
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  northstar-ingestion-dlq {}

  northstar-ingestion {
    # Longer than the worst-case processing time of one document, or it is redelivered.
    defaultVisibilityTimeout = 120 seconds
    # Long polling: fewer empty receives (on AWS, fewer billed requests).
    receiveMessageWait = 10 seconds
    deadLettersQueue {
      name = "northstar-ingestion-dlq"
      maxReceiveCount = 3
    }
  }
}
