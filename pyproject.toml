[project]
name = "secure-ai-agent"
version = "0.1.0"
description = "Enterprise AI operations copilot: advanced RAG, LangGraph agents, MCP tools and human approval on AWS Bedrock."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Dependencies are added incrementally with `uv add`, each in the commit that first uses it.
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.6",
    "fastapi>=0.162",
    "langchain-aws>=1.9.3",
    "langchain-core>=1.8.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "ollama>=0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pymupdf>=2.1",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
datagen = [
    "pyyaml>=6.0.3",
    "reportlab>=5.1",
]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17",
    "types-boto3[bedrock-runtime,sqs]>=1.44.6",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
# Application, not a library: dependencies are installed, the project itself is not packaged.
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "S",        # bandit (security)
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ASYNC",    # async pitfalls (blocking calls in async code)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of a test

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]
# scripts/ has no __init__.py: map files to modules from the repository root
# (scripts/seed_business_data.py imports scripts.generate_pdfs).
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "pymupdf4llm.*"]  # no type information shipped
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local Docker services (PostgreSQL, ElasticMQ); no AWS, no cost",
    "llm: needs the local Ollama server (compose profile `llm`) with models pulled; free",
    "aws: calls real AWS services and may incur cost; opt-in only, never in CI",
]
