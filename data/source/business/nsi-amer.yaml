    status: delivered
    order_date: 2026-10-27
    delivered_date: 2026-11-03
    lines: [{sku: CP-150S, quantity: 2}]
  # Build-to-order pump: not returnable, whatever the date.
  - number: SO-2026-0102
    customer: C-1003
    status: delivered
    order_date: 2026-09-22
    delivered_date: 2026-10-28
    lines: [{sku: NX-6200, quantity: 1}]
