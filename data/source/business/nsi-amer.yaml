# Business records of tenant nsi-amer: the source of the customers, orders, invoices,
# support tickets and suppliers tables (`make seed`). Products come from products.yaml.
# All names and figures are fictional.
#
# Many records are deliberate scenarios for the agent, noted in comments. They are
# written against a reference date of 2026-11-15 and the active policies:
# returns within 30 days of delivery (NSI-POL-RET-003 v3.0; 45 days in the superseded v2.1),
# build-to-order and final-sale items not returnable, SLA response targets per support tier
# (NSI-SLA-CS-002), Kestrel Fluid Systems as supplier SUP-0007 (NSI-AGR-SUP-014).
currency: USD

customers:
  - {number: C-1001, name: Riverside Bottling Co., segment: food processing, country: US, support_tier: premium}
  - {number: C-1002, name: Gulf Coast Marine Services, segment: marine, country: US, support_tier: platinum}
  - {number: C-1003, name: Summit Steel Fabrication, segment: manufacturing, country: US, support_tier: standard}
