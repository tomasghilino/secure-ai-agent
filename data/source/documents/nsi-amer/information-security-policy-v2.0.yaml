sections:
  - heading: 1. Purpose and Scope
    blocks:
      - p: >-
          This policy sets the minimum security requirements for protecting the information
          and systems of Northstar Industrial Americas, Inc. It applies to all employees,
          contractors and suppliers who access Northstar information, on any device and in any
          location.

  - heading: 2. Data Classification
    blocks:
      - p: >-
          All information is classified by its owner into one of four levels. The
          classification determines who may access the information and how it must be handled.
      - table:
          columns: [Level, Definition, Examples, Handling]
          widths: [0.14, 0.30, 0.28, 0.28]
          rows:
            - [Public, "Approved for release outside the company.", "Product catalog, press releases", "No restrictions"]
            - [Internal, "For employees and contractors; low impact if disclosed.", "Policies, procedures, org charts", "Share only internally"]
            - [Confidential, "Sensitive business information; significant impact if disclosed.", "Supplier contracts, pricing, incident runbooks", "Need-to-know access; encrypted in transit"]
            - [Restricted, "Highest sensitivity; severe legal or financial impact if disclosed.", "Payment data, employee personal records", "Encryption at rest; access approved by the data owner"]

  - heading: 3. Access Control
    blocks:
      - bullets:
          - Access follows the principle of least privilege and is granted by role.
          - Multi-factor authentication (MFA) is required for all remote access.
          - Access to systems holding confidential or restricted data is reviewed quarterly by the system owner.
          - Accounts are disabled on the employee's last working day.

  - heading: 4. Passwords
    blocks:
      - p: >-
          Passwords must be at least **14 characters** long. Employees must use the
          company-approved **password manager** and must not reuse passwords across systems or
          share them with anyone.

  - heading: 5. Acceptable Use of AI Tools
    blocks:
      - p: >-
          Employees must not paste confidential or restricted information into AI tools that
          have not been approved by Information Security. The approved internal assistant is
          the **Northstar AI Operations Copilot**, which enforces access controls on the
          documents and data it uses.
      - note: >-
          Output generated by AI tools must be reviewed by the employee before it is sent to
          customers or used in business decisions.

  - heading: 6. Supplier Security
    blocks:
      - p: >-
          Suppliers with access to confidential information must complete a security
          assessment before access is granted and **annually** thereafter. Contracts with such
          suppliers include confidentiality and incident notification clauses.

  - heading: 7. Incident Reporting
    blocks:
      - p: >-
          Any suspected security incident, including lost devices and phishing emails that
          were clicked, must be reported to Security Operations **within 1 hour** of discovery.
          Incidents are handled according to the Security Incident Response Runbook
          (NSI-RBK-SEC-011).

  - heading: 8. Compliance
    blocks:
      - p: >-
          Violations of this policy may result in disciplinary action, up to and including
          termination of employment or contract. Exceptions must be requested in writing and
          approved by the Head of Information Security for a limited period.

  - heading: 9. Revision History
    blocks:
      - table:
          columns: [Version, Effective date, Summary of changes]
          widths: [0.15, 0.20, 0.65]
          rows:
            - ["2.0", 2025-10-01, "Four-level data classification introduced; AI tool usage rules added; minimum password length raised to 14 characters."]
            - ["1.4", 2024-09-01, "MFA extended to all remote access."]
            - ["1.0", 2022-04-01, "Initial policy."]
