doc_id: NSI-POL-PRC-001
title: Procurement and Purchasing Policy
version: "4.0"
effective_date: 2026-01-15
status: active
supersedes: "3.2"
tenant_id: nsi-amer
department: Procurement
doc_type: policy
classification: internal
owner: Head of Procurement
approved_by: Chief Financial Officer
next_review: 2027-01-15

sections:
  - heading: 1. Purpose and Scope
    blocks:
      - p: >-
          This policy establishes how Northstar Industrial Americas, Inc. ("Northstar")
          purchases goods and services from third parties. Its objectives are to obtain the
          best total value, ensure that every commitment is properly authorized, and protect
          the company against fraud, conflicts of interest and supplier risk.
      - p: >-
          The policy applies to all employees, contractors and business units that commit
          Northstar funds, regardless of the payment method used. Business travel and related
          expenses are governed by the Employee Travel and Expense Policy (NSI-POL-TRV-007)
          and are excluded from this policy.

  - heading: 2. Definitions
    blocks:
      - table:
          columns: [Term, Definition]
          widths: [0.25, 0.75]
          rows:
            - [Purchase order (PO), "The formal document issued by Procurement that authorizes a supplier to deliver goods or services at an agreed price and terms."]
            - [Total purchase value, "The full value of the commitment over its entire term, including taxes, freight, installation and recurring fees."]
            - [Preferred supplier, "A supplier that has completed onboarding and is listed in the Preferred Supplier List maintained by Procurement."]
            - [Sole source, "A purchase awarded to a single supplier without competitive quotes, justified on form NSI-FRM-PRC-07."]
            - [Split purchase, "Dividing a single requirement into smaller orders so that each falls below an approval or quote threshold."]

  - heading: 3. Purchase Order Requirement
    blocks:
      - p: >-
          A purchase order is required for every purchase with a total purchase value
          **above USD 1,000**. Suppliers must not be asked to start work or ship goods before
          the PO has been issued. Invoices received without a valid PO reference are returned
          to the supplier by Accounts Payable.
      - p: >-
          Purchases up to USD 1,000 may be paid with a company purchasing card, provided the
          cardholder retains the receipt and records the business purpose.

  - heading: 4. Approval Authority
    blocks:
      - p: >-
          Approval is based on the total purchase value. Approvers must confirm that the
          purchase is budgeted, necessary and compliant with this policy before approving the
          requisition in the procurement system.
      - table:
          columns: [Total purchase value (USD), Approval required]
          widths: [0.35, 0.65]
          rows:
            - ["Up to 5,000", Line manager]
            - ["5,000.01 to 50,000", Department head and Procurement Manager]
            - ["50,000.01 to 250,000", Chief Financial Officer]
            - ["Above 250,000", Chief Executive Officer]
      - note: >-
          The Board of Directors must be notified of any single commitment above
          USD 1,000,000. Notification is prepared by the Chief Financial Officer before the
          purchase order is issued.

  - heading: 5. Competitive Quotes and Sole Sourcing
    blocks:
      - p: >-
          At least **three written quotes** from qualified suppliers are required for every
          purchase above USD 25,000. Quotes must be based on the same specification and be
          attached to the requisition. The selection rationale must be documented when the
          lowest-priced quote is not selected.
      - p: >-
          When only one supplier can meet the requirement, the requester completes the
          sole-source justification form NSI-FRM-PRC-07, which must be approved by the
          Procurement Manager before the purchase order is issued.

  - heading: 6. Supplier Onboarding
    blocks:
      - p: >-
          New suppliers must complete onboarding before receiving a purchase order.
          Procurement completes onboarding within **10 business days** of receiving all
          required documents.
      - steps:
          - The requester submits a new supplier request with the business justification.
          - Procurement performs sanctions and restricted-party screening.
          - The supplier provides tax documentation and banking details on company letterhead.
          - The supplier provides a valid certificate of insurance meeting Northstar's minimum coverage.
          - Procurement approves the supplier and adds it to the vendor master in the ERP system.

  - heading: 7. Payment Terms
    blocks:
      - p: >-
          Northstar's standard payment terms are **Net 45** days from the date a correct
          invoice is received. Early-payment discounts offered by suppliers are taken when the
          discount is **1.5% or more**. Any deviation from standard terms requires approval
          from the Finance Controller.

  - heading: 8. Prohibited Practices
    blocks:
      - bullets:
          - Splitting a purchase to avoid an approval or quote threshold.
          - Committing funds before the required approvals are obtained, except under Section 9.
          - Accepting gifts or hospitality from suppliers above the limits of the Code of Conduct.
          - Participating in a purchasing decision involving a supplier in which the employee has a personal interest.

  - heading: 9. Emergency Purchases
    blocks:
      - p: >-
          In an emergency that threatens safety, customer commitments or continuity of
          operations, a department head may authorize a purchase of up to **USD 15,000**
          without prior approval. Retroactive approval following Section 4 must be obtained
          within **2 business days**, together with a written description of the emergency.

  - heading: 10. Conflicts of Interest
    blocks:
      - p: >-
          All employees with purchasing authority must submit a conflict-of-interest
          declaration annually and whenever their circumstances change. Declared conflicts are
          reviewed by the Head of Procurement and, where necessary, the employee is removed from
          the purchasing decision.

  - heading: 11. Revision History
    blocks:
      - table:
          columns: [Version, Effective date, Summary of changes]
          widths: [0.15, 0.20, 0.65]
          rows:
            - ["4.0", 2026-01-15, "Approval thresholds restructured (CFO threshold lowered from 100,000 to 50,000); quote threshold raised from 10,000 to 25,000; standard payment terms changed from Net 30 to Net 45; emergency purchase clause added."]
            - ["3.2", 2024-07-01, "Clarified purchasing card limits and supplier onboarding documents."]
            - ["3.0", 2023-03-01, "Policy restructured; electronic requisitions introduced."]
