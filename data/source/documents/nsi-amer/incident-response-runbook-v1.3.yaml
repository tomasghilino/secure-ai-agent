          columns: [Version, Effective date, Summary of changes]
          widths: [0.15, 0.20, 0.65]
          rows:
            - ["1.3", 2026-05-15, "SEV1 acknowledgement target reduced to 15 minutes; evidence preservation steps expanded."]
