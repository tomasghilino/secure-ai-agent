    category: factual
    question: I think one of our servers has been hacked. Should I shut it down right away?
    as_of: null
    relevant:
      - {doc_key: NSI-RBK-SEC-011, version: "1.3", section: "5. Evidence Preservation"}
    forbidden: []
    answer: No, do not power it off; disconnect it from the network instead and capture memory and logs before making changes.

