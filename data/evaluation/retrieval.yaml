    category: factual
    question: How much electricity can a customer save by choosing the variable-speed version of our screw compressor?
    as_of: null
    relevant:
      - {doc_key: NSI-CAT-PRD-001, version: "2026.2", section: "5. Air Compressors"}
    forbidden: []
