# Retrieval evaluation set: each question lists the document sections that contain its answer.
# Derived from data/source/documents; section names are the exact headings of those files.
questions:
  # ------------------------------------------------------------------ factual
  - id: q01
    tenant: nsi-amer
    category: factual
    question: How long does a customer have to ask for a return?
    as_of: null
    relevant:
      - {doc_key: NSI-POL-RET-003, version: "3.0", section: "3. Return Eligibility"}
    forbidden:
      - {doc_key: NSI-POL-RET-003, version: "2.1"}
    answer: 30 calendar days from delivery.

  - id: q02
    tenant: nsi-amer
    category: factual
    question: A strategic customer wants to send back a pump seven weeks after it arrived. Is that still possible?
    as_of: null
    relevant:
      - {doc_key: NSI-POL-RET-003, version: "3.0", section: "8. Exceptions"}
    forbidden:
      - {doc_key: NSI-POL-RET-003, version: "2.1"}
    answer: Only as a late return approved by the Director of Customer Operations (up to 60 days for strategic accounts), with a 25% restocking fee and a written justification.

  - id: q03
    tenant: nsi-amer
    category: factual
    question: A breakdown has stopped the line and we need a part right now. Can a department head buy it before the usual sign-offs?
    as_of: null
    relevant:
      - {doc_key: NSI-POL-PRC-001, version: "4.0", section: "9. Emergency Purchases"}
    forbidden:
      - {doc_key: NSI-POL-PRC-001, version: "3.2"}
    answer: Yes, a department head may authorize up to USD 15,000 without prior approval, with retroactive approval within 2 business days.

